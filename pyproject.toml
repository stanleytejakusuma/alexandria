[project]
name = "alexandria-kb"
version = "0.0.1"
description = "A personal knowledge engine that synthesizes instead of transcribes -- every claim carries a citation back to its source."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Stanley" }]
keywords = [
    "rag", "retrieval-augmented-generation", "knowledge-base", "llm-memory",
    "agent-memory", "hybrid-search", "reranking", "citations", "knowledge-graph",
    "vector-search", "lancedb", "markdown", "obsidian", "second-brain",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/stanleytejakusuma/alexandria"
Repository = "https://github.com/stanleytejakusuma/alexandria"

[project.scripts]
alexandria = "alexandria.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
