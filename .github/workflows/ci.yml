name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # #10 procurement floor: this used to be `pip install -e ".[dev]"`,
      # which ignores uv.lock entirely -- floating specifiers (e.g.
      # lancedb>=0.25) resolve to whatever PyPI has NOW, so a same-day
      # upstream release could silently change what CI actually tests
      # without a diff in this repo to review. `uv sync --locked` refuses
      # to proceed if uv.lock is stale relative to pyproject.toml (exit
      # nonzero) instead of silently re-resolving, so a dependency bump
      # must go through an explicit `uv lock` commit like any other change.
      - name: Install (pinned via uv.lock)
        run: uv sync --locked --extra dev

      - name: Offline test suite
        # HF_HUB_OFFLINE=1 makes this job genuinely offline (Red review,
        # 2026-08-20): without it, a job NAMED "offline" still performs real
        # network model downloads on a cold runner -- the exact
        # network-dependent nondeterminism that hung CI twice before the
        # failure-cooldown fix. Offline mode fails fast (~3s) when a model
        # is not cached, and every test that constructs a real model here
        # now exercises the documented offline-degradation path instead of
        # hoping the network cooperates.
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --locked python -m pytest tests/ -q

      - name: Leak scanner (unconditional)
        run: uv run --locked python scripts/precommit-scan.py --all

      # eval-gate.py skips itself on CI (no private corpus/index here) -- its
      # retrieval regression measurement is a local-machine gate by design.
